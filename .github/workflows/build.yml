name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate repo structure
        run: |
          echo "Checking repository structure..."
          for dir in clang-tidy devcontainer docker docs dotfiles jenkins scripts singularity vscode; do
            if [ -d "$dir" ]; then
              echo "✓ $dir/ exists"
            else
              echo "✗ $dir/ missing"
              exit 1
            fi
          done
          echo "All directories validated."

      - name: Check shell scripts
        run: |
          find scripts -name "*.sh" -exec bash -n {} \; 2>&1 || echo "No shell scripts to validate"

      - name: Lint Dockerfiles
        run: |
          find docker -name "Dockerfile*" -exec echo "Found: {}" \; || echo "No Dockerfiles found"
